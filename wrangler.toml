name = "leaders-academia-bot"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
GEMINI_MODELS = "gemini-2.5-flash,gemini-2.5-flash-lite"
GROQ_MODEL = "llama-3.3-70b-versatile"
GRAPH_VERSION = "v21.0"
WEB_MAX_PER_HOUR = "40"
MAX_MSGS_PER_HOUR = "30"

# OPTIONAL: remember WhatsApp conversations (free KV). Create a KV namespace in the
# Cloudflare dashboard, paste its ID below, remove the leading '#' signs, then commit.
# [[kv_namespaces]]
# binding = "CHAT_KV"
# id = "PASTE_NAMESPACE_ID_HERE"
